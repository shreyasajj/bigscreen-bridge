[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigscreen-bridge"
version = "0.1.0"
description = "Authenticated KDE Plasma Bigscreen bridge"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.11,<4", "dbus-next==0.2.3"]

[project.optional-dependencies]
mqtt = ["aiomqtt>=2.3,<3"]
ha-test = ["homeassistant==2026.2.3", "home-assistant-frontend==20260128.6"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-aiohttp>=1.0", "ruff>=0.9"]

[project.scripts]
bigscreen-bridge = "bigscreen_bridge.server:main"
bigscreen-bridge-open = "bigscreen_bridge.open_link:main"

[tool.setuptools.packages.find]
where = ["bigscreen-bridge/src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# The Home Assistant integration lives in its own repository, checked out next to this one.
pythonpath = [".", "../ha-bigscreen-bridge"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"bigscreen-bridge/src/bigscreen_bridge/kwin.py" = ["F821"] # D-Bus signature annotations
