[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigscreen-bridge"
version = "0.2.2"
description = "Authenticated KDE Plasma Bigscreen bridge"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.11,<4", "dbus-next==0.2.3"]

[project.optional-dependencies]
mqtt = ["aiomqtt>=2.3,<3"]
# Test-only. Patched Home Assistant releases need Python 3.14.2+; the bridge itself still runs on 3.12.
ha-test = [
    "homeassistant==2026.11.2; python_version >= '3.14'",
    "home-assistant-frontend==20261028.6; python_version >= '3.14'",
]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-aiohttp>=1.0", "pytest-cov>=6", "ruff==0.17.5"]

[project.scripts]
bigscreen-bridge = "bigscreen_bridge.server:main"
bigscreen-bridge-open = "bigscreen_bridge.open_link:main"
bigscreen-bridge-clients = "bigscreen_bridge.pairing:main"
bigscreen-bridge-update = "bigscreen_bridge.update:main"

[tool.setuptools.packages.find]
where = ["bigscreen-bridge/src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# The Home Assistant integration lives in its own repository, checked out next to this one.
pythonpath = [".", "../ha-bigscreen-bridge"]

[tool.coverage.run]
# Paths rather than package names: the integration is a sibling checkout, put on the path by
# tests/conftest.py after coverage starts, and tests/test_bridge.py loads its client by file.
source = ["bigscreen-bridge/src/bigscreen_bridge", "../ha-bigscreen-bridge/custom_components/bigscreen_bridge"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Errors, pyflakes, whitespace, import order, likely bugs, outdated syntax, unused
# noqa comments, and blocking calls in async code. Line length and formatting are
# not enforced (the tree predates them).
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "ASYNC", "RUF100"]
# Home Assistant's own style takes timeout parameters; the polling loops are deliberate.
ignore = ["ASYNC109", "ASYNC110"]

[tool.ruff.lint.per-file-ignores]
# Tests and one-off scripts may block inside a coroutine.
"tests/**" = ["ASYNC"]
"scripts/**" = ["ASYNC"]
"bigscreen-bridge/src/bigscreen_bridge/kwin.py" = ["F821"] # D-Bus signature annotations
"bigscreen-bridge/src/bigscreen_bridge/status.py" = ["F821"]
